<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos - Guia Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 25px 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #b8c1d1;
            margin-bottom: 30px;
        }

        .lista {
            max-width: 650px;
            margin: auto;
        }

        .jogo {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1f2937;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 14px;
            border-radius: 14px;
        }

        .icone {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #374151;
            border-radius: 12px;
            font-size: 40px;
            flex-shrink: 0;
        }

        .nome {
            font-size: 21px;
            font-weight: bold;
        }

        .descricao {
            color: #b8c1d1;
            margin-top: 6px;
        }

        .voltar {
            display: block;
            max-width: 650px;
            margin: 25px auto 0;
            color: #b8c1d1;
            text-decoration: none;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>🎮 Jogos</h1>

    <p class="subtitulo">
        Escolha um jogo para ver seus guias.
    </p>

    <div class="lista">

        <a class="jogo" href="bloxfruits.html">

            <div class="icone">
                🏴‍☠️
            </div>

            <div>

                <div class="nome">
                    Blox Fruits
                </div>

                <div class="descricao">
                    Frutas, raças, itens, bosses e muito mais.
                </div>

            </div>

        </a>

    </div>

    <a class="voltar" href="index.html">
        ← Voltar para o início
    </a>

</body>

</html>
